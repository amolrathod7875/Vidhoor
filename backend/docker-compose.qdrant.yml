services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: vidhoor-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
