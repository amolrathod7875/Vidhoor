services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vidhoor-backend:local
    container_name: vidhoor-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      QDRANT_COLLECTION: indian_law_v2
      QDRANT_PREFER_GRPC: "true"
      RAG_VECTOR_BACKEND: chroma
    depends_on:
      - chroma
      - qdrant
    ports:
      - "8001:8000"
    volumes:
      - ../data:/app/data:ro
      - ../wallet:/app/wallet:ro
      - ../vidhoor-7875-firebase-adminsdk-fbsvc-ec13a1c8ac.json:/app/vidhoor-7875-firebase-adminsdk-fbsvc-ec13a1c8ac.json:ro

  chroma:
    image: chromadb/chroma:latest
    container_name: vidhoor-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: vidhoor-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      QDRANT__SERVICE__HTTP_PORT: "6333"
    volumes:
      - qdrant_data:/qdrant/storage

  nginx:
    image: nginx:1.27-alpine
    container_name: vidhoor-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  chroma_data:
  qdrant_data:
