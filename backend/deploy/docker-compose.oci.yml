services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vidhoor-backend:local
    container_name: vidhoor-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    depends_on:
      - chroma
    ports:
      - "8001:8000"
    volumes:
      - ../data:/app/data:ro
      - ../wallet:/app/wallet:ro

  chroma:
    image: chromadb/chroma:latest
    container_name: vidhoor-chroma
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/chroma/chroma

  nginx:
    image: nginx:1.27-alpine
    container_name: vidhoor-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  chroma_data:
