name: Backend Auto Deploy (OCI)

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-auto-deploy.yml"
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      IMAGE_URI_BASE: ${{ secrets.OCI_REGION }}.ocir.io/${{ secrets.OCI_NAMESPACE }}/vidhoor-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCI_REGION }}.ocir.io
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push ARM64 backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          platforms: linux/arm64
          cache-from: type=gha,scope=vidhoor-backend
          cache-to: type=gha,mode=max,scope=vidhoor-backend
          tags: |
            ${{ env.IMAGE_URI_BASE }}:latest
            ${{ env.IMAGE_URI_BASE }}:${{ github.sha }}

      - name: Deploy on OCI VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          port: ${{ secrets.OCI_VM_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/vidhoor/backend

            export OCI_REGION='${{ secrets.OCI_REGION }}'
            export OCI_NAMESPACE='${{ secrets.OCI_NAMESPACE }}'
            export OCI_REGISTRY_USERNAME='${{ secrets.OCI_REGISTRY_USERNAME }}'
            export OCI_AUTH_TOKEN='${{ secrets.OCI_AUTH_TOKEN }}'
            export BACKEND_IMAGE='${{ env.IMAGE_URI_BASE }}:${{ github.sha }}'

            bash deploy/deploy_backend_oci.sh
