name: Backend Deploy (OCI VM, no registry)

# Builds the image directly on the OCI VM via SSH — no OCIR/registry cost.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-auto-deploy.yml"
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OCI VM over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_VM_HOST }}
          username: ${{ secrets.OCI_VM_USER }}
          key: ${{ secrets.OCI_VM_SSH_KEY }}
          port: ${{ secrets.OCI_VM_SSH_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/vidhoor
            git fetch --all
            git reset --hard origin/main
            cd backend
            docker compose -f deploy/docker-compose.oci.yml build backend
            docker compose -f deploy/docker-compose.oci.yml up -d --no-deps --force-recreate backend
            docker image prune -af --filter "until=168h" || true
            docker compose -f deploy/docker-compose.oci.yml ps
